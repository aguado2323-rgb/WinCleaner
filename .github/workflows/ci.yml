name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix ui
      - run: npm run build --prefix ui
      - run: cargo test -p wincleaner-core
      - run: cargo clippy -p wincleaner-core -- -D warnings
      - run: cargo check -p wincleaner
