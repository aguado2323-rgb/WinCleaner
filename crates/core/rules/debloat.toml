# Catálogo de aplicaciones preinstaladas que se pueden quitar sin dañar Windows.
#
# Reglas para añadir entradas:
#  - `package` es el nombre exacto del paquete (Get-AppxPackage), solo letras, cifras y puntos.
#  - Nunca incluir componentes de los que dependa Windows: Microsoft Store, Edge/WebView2,
#    Shell Experience Host, menú Inicio, Configuración, Seguridad de Windows, .NET/VCLibs...
#  - risk = "safe": casi nadie la echa de menos. risk = "cautious": hay quien la usa; se explica.
#  - Todas se pueden volver a instalar desde Microsoft Store.

[[app]]
id = "bing-news"
package = "Microsoft.BingNews"
name = "Noticias (Microsoft Start)"
category = "Microsoft"
what = "Lector de noticias de Microsoft."
impact = "Solo desaparece la app. El widget de Windows usa su propio componente."
risk = "safe"

