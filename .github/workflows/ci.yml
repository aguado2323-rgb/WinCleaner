name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo test -p wincleaner-core
      - run: cargo clippy -p wincleaner-core -- -D warnings
      - run: cargo check -p wincleaner
      - name: Compilar ejecutable portable
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
        working-directory: .
      - name: Tamaño del ejecutable
        run: |
          $f = Get-Item target/release/wincleaner.exe
          "{0:N1} MB" -f ($f.Length / 1MB) | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: WinCleaner-portable
          path: target/release/wincleaner.exe
