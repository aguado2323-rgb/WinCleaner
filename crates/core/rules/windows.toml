# Reglas de limpieza declarativas. Cada ruta es un directorio cuyo CONTENIDO se limpia.
# Se admiten variables de entorno al estilo %VAR%.
# `safe = true` => se marca por defecto en la interfaz.

[[rule]]
id = "user-temp"
name = "Temporales del usuario"
category = "Sistema"
description = "Archivos temporales de las aplicaciones del usuario."
help = "Archivos temporales que los programas dejan en tu carpeta Temp mientras trabajan; casi siempre sobran. Si un programa abierto está usando alguno, se salta. Riesgo muy bajo: va a la cuarentena y puedes devolverlo."
paths = ["%TEMP%"]
safe = true

[[rule]]
id = "windows-temp"
name = "Temporales de Windows"
category = "Sistema"
description = "Carpeta Temp del sistema (puede requerir administrador)."
help = "Lo mismo que los temporales del usuario, pero de la carpeta Temp de todo el sistema. Algunos archivos pueden estar en uso y se saltan; sin permisos de administrador puede que no se limpie todo. Riesgo muy bajo y reversible desde la cuarentena."
paths = ["%WINDIR%\\Temp"]
safe = true

[[rule]]
id = "thumbnails"
name = "Caché de miniaturas"
category = "Sistema"
description = "Miniaturas del Explorador; Windows las regenera."
help = "Windows guarda una copia pequeña de tus fotos y vídeos para mostrar las vistas previas rápido. Si la borras, Windows la vuelve a crear sola; al abrir carpetas con imágenes tardará un poco más la primera vez. Sin riesgo para tus archivos."
paths = ["%LOCALAPPDATA%\\Microsoft\\Windows\\Explorer"]
safe = true

[[rule]]
id = "crash-dumps"
name = "Volcados de error"
category = "Sistema"
description = "Informes y volcados de fallos de aplicaciones."
help = "Informes que Windows y los programas guardan cuando algo se cierra por un error. Sirven para diagnosticar fallos, pero ocupan espacio y normalmente no los vas a mirar. Si estás investigando un problema reciente, déjalo sin marcar."
paths = ["%LOCALAPPDATA%\\CrashDumps", "%LOCALAPPDATA%\\Microsoft\\Windows\\WER"]
safe = true

[[rule]]
id = "chrome-cache"
name = "Chrome: caché"
category = "Navegadores"
description = "Caché de Google Chrome (no toca contraseñas ni cookies)."
help = "Copia de páginas, imágenes y scripts que Chrome guarda para cargar webs más rápido. Al borrarla, las webs cargarán algo más lento la primera vez. No toca contraseñas, cookies, historial ni marcadores, así que no se cierran tus sesiones."
paths = [
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\Cache\\Cache_Data",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\Code Cache",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\GPUCache",
]
safe = true

[[rule]]
id = "edge-cache"
name = "Edge: caché"
category = "Navegadores"
description = "Caché de Microsoft Edge (no toca contraseñas ni cookies)."
help = "Copia de páginas e imágenes que Edge guarda para ir más rápido. Se vuelve a crear sola; las webs cargan un poco más lento la primera vez. No toca contraseñas, cookies ni historial."
paths = [
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\Default\\Cache\\Cache_Data",
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\Default\\Code Cache",
  "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\Default\\GPUCache",
]
safe = true

[[rule]]
id = "firefox-cache"
name = "Firefox: caché"
category = "Navegadores"
description = "Caché de Mozilla Firefox."
help = "Caché de Firefox. Está sin marcar porque Firefox guarda sus datos por perfil y conviene cerrarlo antes de limpiar. Si lo cierras primero, el riesgo es muy bajo; no toca contraseñas ni marcadores."
paths = ["%LOCALAPPDATA%\\Mozilla\\Firefox\\Profiles"]
safe = false

[[rule]]
id = "brave-cache"
name = "Brave: caché"
category = "Navegadores"
description = "Caché de Brave (no toca contraseñas ni cookies)."
help = "Copia de páginas e imágenes que Brave guarda para ir más rápido. Se regenera sola. No toca contraseñas, cookies ni historial."
paths = [
  "%LOCALAPPDATA%\\BraveSoftware\\Brave-Browser\\User Data\\Default\\Cache\\Cache_Data",
  "%LOCALAPPDATA%\\BraveSoftware\\Brave-Browser\\User Data\\Default\\Code Cache",
  "%LOCALAPPDATA%\\BraveSoftware\\Brave-Browser\\User Data\\Default\\GPUCache",
]
safe = true

[[rule]]
id = "opera-cache"
name = "Opera: caché"
category = "Navegadores"
description = "Caché de Opera (no toca contraseñas ni cookies)."
help = "Copia de páginas e imágenes que Opera guarda para ir más rápido. Se regenera sola. No toca contraseñas, cookies ni historial."
paths = [
  "%APPDATA%\\Opera Software\\Opera Stable\\Cache\\Cache_Data",
  "%APPDATA%\\Opera Software\\Opera Stable\\Code Cache",
  "%APPDATA%\\Opera Software\\Opera Stable\\GPUCache",
]
safe = true

[[rule]]
id = "vivaldi-cache"
name = "Vivaldi: caché"
category = "Navegadores"
description = "Caché de Vivaldi (no toca contraseñas ni cookies)."
help = "Copia de páginas e imágenes que Vivaldi guarda para ir más rápido. Se regenera sola. No toca contraseñas, cookies ni historial."
paths = [
  "%LOCALAPPDATA%\\Vivaldi\\User Data\\Default\\Cache\\Cache_Data",
  "%LOCALAPPDATA%\\Vivaldi\\User Data\\Default\\Code Cache",
  "%LOCALAPPDATA%\\Vivaldi\\User Data\\Default\\GPUCache",
]
safe = true

[[rule]]
id = "inet-cache"
name = "Archivos temporales de Internet"
category = "Sistema"
description = "Caché web heredada de Windows (INetCache)."
help = "Caché web antigua de Windows, usada por Internet Explorer y algunos programas del sistema. Se vuelve a rellenar sola. Riesgo muy bajo."
paths = ["%LOCALAPPDATA%\\Microsoft\\Windows\\INetCache"]
safe = true

[[rule]]
id = "windows-update-cache"
name = "Descargas de Windows Update"
category = "Sistema"
description = "Paquetes ya instalados; Windows los vuelve a descargar si hacen falta (requiere administrador)."
help = "Paquetes de actualización que Windows ya descargó. Si hacen falta de nuevo, Windows los descarga otra vez. No lo marques si tienes una actualización a medias. Necesita permisos de administrador."
paths = ["%WINDIR%\\SoftwareDistribution\\Download"]
safe = true

[[rule]]
id = "delivery-optimization"
name = "Optimización de distribución"
category = "Sistema"
description = "Caché de actualizaciones compartidas entre equipos (requiere administrador)."
help = "Windows comparte partes de las actualizaciones con otros equipos para descargarlas antes; esto es esa caché. Se vuelve a crear sola. Necesita permisos de administrador. Riesgo muy bajo."
paths = ["%WINDIR%\\ServiceProfiles\\NetworkService\\AppData\\Local\\Microsoft\\Windows\\DeliveryOptimization\\Cache"]
safe = true

[[rule]]
id = "prefetch"
name = "Prefetch"
category = "Sistema"
description = "Acelera el arranque de apps; al borrarlo la primera apertura de cada una será algo más lenta (requiere administrador)."
help = "Windows apunta qué programas usas para abrirlos más rápido. Si lo borras, la primera apertura de cada programa será algo más lenta hasta que se reconstruya. Casi no libera espacio, por eso viene sin marcar. Necesita administrador."
paths = ["%WINDIR%\\Prefetch"]
safe = false

[[rule]]
id = "directx-shader-cache"
name = "Caché de sombreadores de DirectX"
category = "Juegos y gráficos"
description = "Se regenera sola; los juegos pueden tardar un poco más la primera vez."
help = "Los juegos guardan aquí piezas gráficas ya preparadas. Se regeneran solas; el primer arranque de cada juego puede tardar un poco más o dar tirones al compilar de nuevo. Sin riesgo para tus partidas guardadas."
paths = ["%LOCALAPPDATA%\\D3DSCache"]
safe = true

[[rule]]
id = "nvidia-cache"
name = "Caché de NVIDIA"
category = "Juegos y gráficos"
description = "Cachés de sombreadores de DirectX y OpenGL de NVIDIA."
help = "Caché de piezas gráficas que el controlador de NVIDIA guarda para que los juegos carguen antes. Se regenera sola; el primer arranque de cada juego puede ir algo más lento. No toca tus partidas ni los controladores."
paths = ["%LOCALAPPDATA%\\NVIDIA\\DXCache", "%LOCALAPPDATA%\\NVIDIA\\GLCache"]
safe = true

[[rule]]
id = "discord-cache"
name = "Discord: caché"
category = "Aplicaciones"
description = "Imágenes y datos temporales de Discord; no cierra tu sesión."
help = "Imágenes y datos temporales que Discord guarda. Al abrirlo tardará un poco más en cargar las imágenes. No cierra tu sesión ni borra mensajes (esos están en los servidores de Discord)."
paths = [
  "%APPDATA%\\discord\\Cache\\Cache_Data",
  "%APPDATA%\\discord\\Code Cache",
  "%APPDATA%\\discord\\GPUCache",
]
safe = true

[[rule]]
id = "vscode-cache"
name = "VS Code: caché"
category = "Aplicaciones"
description = "Cachés de Visual Studio Code; no toca ajustes ni extensiones."
help = "Datos temporales que Visual Studio Code guarda para arrancar rápido. Se recrean solos. No toca tus ajustes, extensiones ni proyectos. Cierra VS Code antes de limpiar."
paths = [
  "%APPDATA%\\Code\\Cache",
  "%APPDATA%\\Code\\CachedData",
  "%APPDATA%\\Code\\Code Cache",
  "%APPDATA%\\Code\\GPUCache",
]
safe = true

[[rule]]
id = "npm-cache"
name = "npm: caché"
category = "Desarrollo"
description = "Paquetes descargados por npm; se vuelven a bajar al instalar."
help = "Paquetes que npm descargó antes. Si lo borras, npm los vuelve a bajar cuando haga falta (necesitarás internet). Está sin marcar porque solo interesa a quien programa; no afecta a tus proyectos."
paths = ["%LOCALAPPDATA%\\npm-cache"]
safe = false

[[rule]]
id = "pip-cache"
name = "pip: caché"
category = "Desarrollo"
description = "Paquetes descargados por pip."
help = "Paquetes de Python que pip descargó antes. Si lo borras, se vuelven a bajar al instalar. Sin marcar porque solo interesa a quien programa; no afecta a tus entornos instalados."
paths = ["%LOCALAPPDATA%\\pip\\Cache"]
safe = false

[[rule]]
id = "nuget-cache"
name = "NuGet: caché HTTP"
category = "Desarrollo"
description = "Caché de consultas de NuGet (.NET)."
help = "Caché de consultas de NuGet, el gestor de paquetes de .NET. Se rehace sola, pero la próxima compilación puede tardar un poco más. Solo interesa a quien programa."
paths = ["%LOCALAPPDATA%\\NuGet\\v3-cache"]
safe = false

[[rule]]
id = "store-cache"
name = "Microsoft Store: caché"
category = "Sistema"
description = "Caché temporal de la Tienda de Windows; se regenera sola."
help = "Datos temporales que la Microsoft Store guarda para ir más rápido. Si la Tienda se queda cargando o da fallos, vaciar esto suele arreglarlo. Se recrea sola. No toca tus apps ni compras."
paths = ["%LOCALAPPDATA%\\Packages\\Microsoft.WindowsStore_8wekyb3d8bbwe\\LocalCache"]
safe = true

[[rule]]
id = "wer-queue"
name = "Informes de errores del sistema"
category = "Sistema"
description = "Informes de errores de todo el equipo ya generados (requiere administrador)."
help = "Informes de fallos que Windows guardó para enviar a Microsoft o para diagnóstico. Ocupan espacio y normalmente no se miran. Si estás investigando un fallo reciente, déjalo sin marcar. Necesita administrador."
paths = ["%PROGRAMDATA%\\Microsoft\\Windows\\WER\\ReportArchive", "%PROGRAMDATA%\\Microsoft\\Windows\\WER\\ReportQueue"]
safe = true

[[rule]]
id = "slack-cache"
name = "Slack: caché"
category = "Aplicaciones"
description = "Imágenes y datos temporales de Slack; no cierra tu sesión."
help = "Datos temporales que Slack guarda en tu equipo. Al abrirlo, cargará algo más lento la primera vez. No cierra tu sesión ni borra mensajes (están en los servidores de Slack). Cierra Slack antes de limpiar."
paths = ["%APPDATA%\\Slack\\Cache", "%APPDATA%\\Slack\\Code Cache", "%APPDATA%\\Slack\\GPUCache"]
safe = true

[[rule]]
id = "spotify-cache"
name = "Spotify: caché"
category = "Aplicaciones"
description = "Caché de canciones escuchadas; no toca las descargas sin conexión."
help = "Spotify guarda aquí trozos de las canciones que has escuchado para reproducirlas más rápido. Se rellena sola. No toca tus listas ni las canciones descargadas para escuchar sin conexión (están en otra carpeta). Cierra Spotify antes de limpiar."
paths = ["%LOCALAPPDATA%\\Spotify\\Data"]
safe = true

[[rule]]
id = "steam-htmlcache"
name = "Steam: caché del navegador"
category = "Juegos y gráficos"
description = "Caché del navegador integrado de Steam; no toca tus juegos."
help = "Páginas e imágenes de la tienda y la comunidad que Steam guarda. Se recrea sola. No toca tus juegos, partidas guardadas ni tu sesión. Cierra Steam antes de limpiar."
paths = ["%LOCALAPPDATA%\\Steam\\htmlcache"]
safe = true

[[rule]]
id = "epic-webcache"
name = "Epic Games: caché web"
category = "Juegos y gráficos"
description = "Caché del lanzador de Epic Games; no toca tus juegos."
help = "Datos temporales de la tienda del lanzador de Epic Games. Se recrean solos. No toca tus juegos ni partidas. Cierra el lanzador antes de limpiar."
paths = ["%LOCALAPPDATA%\\EpicGamesLauncher\\Saved\\webcache"]
safe = true

[[rule]]
id = "office-file-cache"
name = "Office: caché de archivos"
category = "Aplicaciones"
description = "Copias temporales de archivos de Office abiertos desde la nube."
help = "Copias temporales que Office guarda de documentos de OneDrive o SharePoint que has abierto. Se vuelven a descargar si hacen falta. Está sin marcar: si tienes cambios sin sincronizar en algún documento, ciérralo y espera a que se sincronice antes de limpiar."
paths = ["%LOCALAPPDATA%\\Microsoft\\Office\\16.0\\OfficeFileCache"]
safe = false

[[rule]]
id = "cargo-cache"
name = "Rust (cargo): caché de paquetes"
category = "Desarrollo"
description = "Paquetes descargados por cargo; se vuelven a bajar al compilar."
help = "Código fuente y paquetes que cargo, el gestor de Rust, descargó antes. Si lo borras, se vuelven a bajar al compilar (necesitarás internet). Solo interesa a quien programa; no afecta a tus proyectos."
paths = ["%USERPROFILE%\\.cargo\\registry\\cache"]
safe = false

[[rule]]
id = "gradle-cache"
name = "Gradle: caché"
category = "Desarrollo"
description = "Dependencias descargadas por Gradle (Java, Android)."
help = "Dependencias que Gradle descargó. Si las borras, se vuelven a bajar en la próxima compilación, que tardará más. Solo interesa a quien programa; no afecta a tus proyectos."
paths = ["%USERPROFILE%\\.gradle\\caches"]
safe = false
